
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  EMPRESA ||--o{ EXPEDIENTE : solicita
  EXPEDIENTE ||--|{ DOCUMENTO : contiene
  EXPEDIENTE ||--o{ INVERSION : detalla
  EXPEDIENTE ||--o| VISITA_TECNICA : tiene
  EXPEDIENTE ||--o| INFORME_TECNICO : genera
  EXPEDIENTE ||--o| SESION_CONAPI : presentado_en
  SESION_CONAPI ||--|{ VOTO : registra
  EXPEDIENTE ||--o| RESOLUCION : resulta_en
  RESOLUCION ||--o| CFI_DIGITAL : emite
  USUARIO ||--o{ EXPEDIENTE : gestiona
  EMPRESA {
    uuid id PK
    string ruc
    string nombre_comercial
    string razon_social
    string representante_legal
    string cedula_rl
    string tipo
    string provincia
    string email
    string aviso_operacion
  }
  EXPEDIENTE {
    uuid id PK
    string numero
    uuid empresa_id FK
    uuid analista_id FK
    uuid cpa_id FK
    string estado
    string modalidad
    decimal monto_inversion
    decimal monto_cfi_est
    timestamp fecha_solicitud
    timestamp fecha_resolucion
  }
  DOCUMENTO {
    uuid id PK
    uuid expediente_id FK
    string tipo
    string nombre_archivo
    string url_storage
    string hash_sha256
    timestamp fecha_carga
    boolean validado
  }
  INVERSION {
    uuid id PK
    uuid expediente_id FK
    date fecha
    string tipo_doc
    string num_documento
    string proveedor
    string descripcion
    decimal monto
    decimal itbms
    boolean conforme
    string observacion
  }
  VISITA_TECNICA {
    uuid id PK
    uuid expediente_id FK
    date fecha_visita
    string analistas
    boolean activos_verificados
    text observaciones
    timestamp creada_en
  }
  INFORME_TECNICO {
    uuid id PK
    uuid expediente_id FK
    uuid analista_id FK
    decimal monto_verificado
    decimal monto_cfi_rec
    string concepto
    text sustento
    string firma_digital
    timestamp firmado_en
  }
  SESION_CONAPI {
    uuid id PK
    string numero_sesion
    date fecha
    string modalidad
    int quorum
    string estado
  }
  VOTO {
    uuid id PK
    uuid sesion_id FK
    uuid expediente_id FK
    uuid miembro_id FK
    string resultado
    string pin_firma
    timestamp emitido_en
  }
  RESOLUCION {
    uuid id PK
    uuid expediente_id FK
    string numero
    date fecha
    decimal monto_aprobado
    string firma_director
    string estado_legal
    timestamp firmada_en
  }
  CFI_DIGITAL {
    uuid id PK
    uuid resolucion_id FK
    string codigo_qr
    string url_descarga
    timestamp emitido_en
    boolean notificado
  }
  USUARIO {
    uuid id PK
    string nombre
    string email
    string rol
    string institucion
  }
`);
document.getElementById('erd').innerHTML = svg;
</script>
