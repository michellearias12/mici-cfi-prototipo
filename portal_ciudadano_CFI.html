
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body,#app{font-family:'DM Sans',sans-serif}
  :root{
    --navy:#0D2B55;--teal:#0E7C6E;--teal-light:#E1F5EE;--teal-mid:#1D9E75;
    --gray-bg:#F7F8FA;--border:#D3D1C7;--text:#1a1a1a;--muted:#5F5E5A;
    --red:#E24B4A;--green:#639922;--amber:#BA7517;
  }
  #app{background:var(--gray-bg);min-height:600px}
  .topbar{background:var(--navy);padding:10px 24px;display:flex;align-items:center;gap:12px}
  .topbar-logo{width:32px;height:32px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center}
  .topbar-logo svg{width:22px;height:22px}
  .topbar-title{color:#fff;font-size:13px;font-weight:500;line-height:1.3}
  .topbar-title span{display:block;font-size:11px;font-weight:400;opacity:0.75}
  .progress-bar{background:var(--navy);border-top:1px solid rgba(255,255,255,0.12);padding:12px 24px}
  .steps-row{display:flex;gap:0;overflow-x:auto}
  .step-item{flex:1;min-width:80px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;cursor:pointer}
  .step-item+.step-item::before{content:'';position:absolute;left:0;top:12px;width:50%;height:2px;background:rgba(255,255,255,0.2);z-index:0}
  .step-item::after{content:'';position:absolute;right:0;top:12px;width:50%;height:2px;background:rgba(255,255,255,0.2);z-index:0}
  .step-item:first-child::before{display:none}
  .step-item:last-child::after{display:none}
  .step-dot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:500;z-index:1;position:relative}
  .step-item.active .step-dot{background:var(--teal-mid);border-color:var(--teal-mid)}
  .step-item.done .step-dot{background:var(--green);border-color:var(--green)}
  .step-label{font-size:10px;color:rgba(255,255,255,0.6);text-align:center;line-height:1.2}
  .step-item.active .step-label{color:#fff;font-weight:500}
  .step-item.done .step-label{color:rgba(255,255,255,0.8)}
  .main{padding:20px 24px;max-width:820px;margin:0 auto}
  .section-card{background:#fff;border:0.5px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
  .section-header{background:var(--navy);padding:12px 20px;display:flex;align-items:center;gap:10px}
  .section-header h2{font-size:13px;font-weight:500;color:#fff;margin:0}
  .section-header .badge{background:rgba(255,255,255,0.2);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
  .section-body{padding:20px}
  .field-row{display:grid;gap:12px;margin-bottom:14px}
  .field-row.cols-2{grid-template-columns:1fr 1fr}
  .field-row.cols-3{grid-template-columns:1fr 1fr 1fr}
  .field-row.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
  .field-group label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
  .field-group input,.field-group select,.field-group textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:#fff;outline:none}
  .field-group input:focus,.field-group select:focus,.field-group textarea:focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(14,124,110,0.15)}
  .field-group textarea{resize:vertical;min-height:72px}
  .subsection-title{font-size:12px;font-weight:500;color:var(--navy);border-bottom:1px solid var(--teal-light);padding-bottom:6px;margin-bottom:12px;margin-top:4px}
  .toggle-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .toggle-btn{padding:6px 14px;border:0.5px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--muted);cursor:pointer;transition:all 0.15s}
  .toggle-btn.active{background:var(--teal-light);border-color:var(--teal-mid);color:var(--teal)}
  .checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .checkbox-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);line-height:1.4}
  .checkbox-item input[type=checkbox]{margin-top:2px;accent-color:var(--teal)}
  .upload-zone{border:1.5px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:var(--gray-bg);margin-bottom:12px;transition:all 0.15s}
  .upload-zone:hover{border-color:var(--teal-mid);background:var(--teal-light)}
  .upload-zone .icon{font-size:24px;color:var(--muted);margin-bottom:6px}
  .upload-zone p{font-size:12px;color:var(--muted)}
  .upload-zone strong{font-size:13px;color:var(--teal);display:block;margin-bottom:2px}
  .file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-light);border:0.5px solid var(--teal-mid);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--teal);margin:4px 4px 4px 0}
  .file-chip button{background:none;border:none;cursor:pointer;color:var(--teal);font-size:14px;padding:0;line-height:1}
  .table-mini{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
  .table-mini th{background:var(--navy);color:#fff;padding:6px 10px;font-weight:500;text-align:left;font-size:11px}
  .table-mini td{padding:6px 10px;border-bottom:0.5px solid var(--border)}
  .table-mini tr:last-child td{border-bottom:none}
  .table-mini input{width:100%;border:none;background:transparent;font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
  .add-row-btn{background:none;border:0.5px dashed var(--teal-mid);color:var(--teal);font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;margin-bottom:12px}
  .add-row-btn:hover{background:var(--teal-light)}
  .nav-row{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;border-top:0.5px solid var(--border);position:sticky;bottom:0}
  .btn-back{background:none;border:0.5px solid var(--border);padding:9px 20px;border-radius:6px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--muted)}
  .btn-next{background:var(--teal);border:none;padding:9px 24px;border-radius:6px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;color:#fff;font-weight:500}
  .btn-next:hover{background:#0a6557}
  .alert{background:var(--teal-light);border:0.5px solid var(--teal-mid);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
  .alert i{color:var(--teal);margin-top:1px;flex-shrink:0}
  .alert p{font-size:12px;color:#085041;line-height:1.5}
  .status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:500}
  .pill-success{background:#EAF3DE;color:#3B6D11}
  .pill-warn{background:#FAEEDA;color:#854F0B}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .summary-item{background:var(--gray-bg);border-radius:8px;padding:10px 14px}
  .summary-item .s-label{font-size:11px;color:var(--muted);margin-bottom:2px}
  .summary-item .s-value{font-size:13px;font-weight:500;color:var(--text)}
  .confirm-box{background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
  .confirm-box h3{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:10px}
  .req-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);padding:5px 0;border-bottom:0.5px solid var(--gray-bg)}
  .req-item:last-child{border-bottom:none}
  .req-icon-ok{color:var(--green)}
  .req-icon-warn{color:var(--amber)}
  .success-screen{text-align:center;padding:40px 24px}
  .success-icon{width:72px;height:72px;background:var(--teal-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;border:3px solid var(--teal-mid)}
  .success-icon i{font-size:36px;color:var(--teal)}
  .exp-num{font-size:28px;font-weight:600;color:var(--navy);margin:12px 0 6px}
  .exp-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
  .timeline{text-align:left;max-width:400px;margin:0 auto 24px}
  .tl-item{display:flex;gap:12px;margin-bottom:14px}
  .tl-dot{width:28px;height:28px;border-radius:50%;background:var(--teal-light);border:2px solid var(--teal-mid);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
  .tl-dot i{font-size:14px;color:var(--teal)}
  .tl-text .tl-title{font-size:13px;font-weight:500;color:var(--text)}
  .tl-text .tl-sub{font-size:12px;color:var(--muted)}
  .hidden{display:none}
</style>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="4" fill="#0D2B55"/><path d="M8 22L16 10L24 22" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 18H21" stroke="#0E7C6E" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
    <div class="topbar-title">
      República de Panamá — MICI
      <span>Sistema Digital de Trámites Industriales</span>
    </div>
  </div>

  <div class="progress-bar">
    <div class="steps-row" id="steps-row"></div>
  </div>

  <div class="main" id="main-content"></div>

  <div class="nav-row" id="nav-row">
    <button class="btn-back" id="btn-back" onclick="goBack()">← Anterior</button>
    <div style="font-size:12px;color:var(--muted)" id="step-counter"></div>
    <button class="btn-next" id="btn-next" onclick="goNext()">Siguiente →</button>
  </div>
</div>

<script>
const STEPS = [
  {id:'inicio', label:'Inicio'},
  {id:'empresa', label:'Empresa'},
  {id:'actividad', label:'Actividad'},
  {id:'documentos', label:'Docs'},
  {id:'inversiones', label:'Inversión'},
  {id:'produccion', label:'Producción'},
  {id:'maquinaria', label:'Maquinaria'},
  {id:'confirmacion', label:'Revisión'},
  {id:'exito', label:'Enviado'},
];

let current = 0;
let data = {tipo:'juridica', modalidades:[], destino:{nacional:70,parcial:20,total:10}};
let inversiones = [{fecha:'',tipo:'FF',ndoc:'',proveedor:'',descripcion:'',monto:'',itbms:''}];
let maquinas = [{cant:'',desc:'',cap:'',func:''}];
let materias = [{desc:'',uso:''}];

function renderSteps(){
  const row = document.getElementById('steps-row');
  row.innerHTML = STEPS.map((s,i)=>`
    <div class="step-item ${i<current?'done':i===current?'active':''}" onclick="jumpTo(${i})">
      <div class="step-dot">${i<current?'✓':(i+1)}</div>
      <div class="step-label">${s.label}</div>
    </div>
  `).join('');
}

function jumpTo(i){if(i<=current)current=i,render();}

function goNext(){if(current<STEPS.length-1){current++;render();window.scrollTo(0,0);}}
function goBack(){if(current>0){current--;render();window.scrollTo(0,0);}}

function render(){
  renderSteps();
  const nav = document.getElementById('nav-row');
  const back = document.getElementById('btn-back');
  const next = document.getElementById('btn-next');
  const counter = document.getElementById('step-counter');
  back.style.display = current===0?'none':'';
  nav.style.display = current===STEPS.length-1?'none':'';
  counter.textContent = `Paso ${current+1} de ${STEPS.length}`;
  if(current===STEPS.length-2){next.textContent='Enviar solicitud ✓';next.style.background='#0a6557';}
  else{next.textContent='Siguiente →';next.style.background='var(--teal)';}

  const pages = [renderInicio, renderEmpresa, renderActividad, renderDocumentos, renderInversiones, renderProduccion, renderMaquinaria, renderConfirmacion, renderExito];
  document.getElementById('main-content').innerHTML = pages[current]();
  attachEvents();
}

function renderInicio(){
  return `
  <div style="padding:8px 0">
    <div class="alert">
      <i class="ti ti-info-circle"></i>
      <p>Este portal le permite solicitar el <strong>Certificado de Fomento Industrial (CFI)</strong> de forma completamente digital. El beneficio equivale al <strong>40% de la inversión realizada</strong> en activos fijos. Base legal: Texto Único de la Ley N°76 de 23 de noviembre de 2009.</p>
    </div>
    <div class="section-card">
      <div class="section-header"><h2>¿Qué es el Certificado de Fomento Industrial?</h2></div>
      <div class="section-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
          <div style="background:var(--gray-bg);border-radius:8px;padding:14px">
            <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Beneficio</div>
            <div style="font-size:22px;font-weight:600;color:var(--teal)">40%</div>
            <div style="font-size:12px;color:var(--muted)">de la inversión como crédito fiscal</div>
          </div>
          <div style="background:var(--gray-bg);border-radius:8px;padding:14px">
            <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Tipo de beneficio</div>
            <div style="font-size:14px;font-weight:500;color:var(--navy)">Crédito fiscal</div>
            <div style="font-size:12px;color:var(--muted)">no transferible, sin intereses</div>
          </div>
        </div>
        <p class="subsection-title">Modalidades elegibles</p>
        <div class="checkbox-grid" style="grid-template-columns:1fr 1fr">
          ${['Investigación y Desarrollo','Sistemas de Gestión de Calidad','Inversión/Reinversión de Utilidades','Capacitación del Recurso Humano','Incremento en el Empleo','Gestión Ambiental'].map(m=>`<div class="checkbox-item"><input type="checkbox" disabled checked> ${m}</div>`).join('')}
        </div>
        <p class="subsection-title">Requisitos previos para iniciar</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${['Empresa registrada y activa en Registro Público','Aviso de Operación vigente','Paz y Salvo Municipal, CSS y Nacional vigentes','Estados Financieros firmados por un CPA','No gozar de otros beneficios fiscales del MICI'].map(r=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><i class="ti ti-circle-check" style="color:var(--teal)"></i>${r}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="section-card">
      <div class="section-header"><h2>Tipo de solicitante</h2></div>
      <div class="section-body">
        <div style="display:flex;gap:10px">
          <div onclick="setTipo('juridica')" id="card-juridica" style="flex:1;border:2px solid var(--teal-mid);border-radius:8px;padding:14px;cursor:pointer;background:var(--teal-light)">
            <i class="ti ti-building" style="font-size:22px;color:var(--teal)"></i>
            <p style="font-size:13px;font-weight:500;color:var(--navy);margin-top:6px">Persona Jurídica</p>
            <p style="font-size:11px;color:var(--muted)">Sociedad / Empresa registrada</p>
          </div>
          <div onclick="setTipo('natural')" id="card-natural" style="flex:1;border:0.5px solid var(--border);border-radius:8px;padding:14px;cursor:pointer">
            <i class="ti ti-user" style="font-size:22px;color:var(--muted)"></i>
            <p style="font-size:13px;font-weight:500;color:var(--navy);margin-top:6px">Persona Natural</p>
            <p style="font-size:11px;color:var(--muted)">Empresario individual</p>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderEmpresa(){
  const esJur = data.tipo==='juridica';
  return `
  <div class="section-card">
    <div class="section-header"><h2>I. Información general de la empresa</h2><span class="badge">Sección I</span></div>
    <div class="section-body">
      ${esJur?`
      <p class="subsection-title">Persona jurídica</p>
      <div class="field-row cols-2">
        <div class="field-group"><label>Nombre comercial *</label><input placeholder="Ej. Industrias Panamá S.A." id="f-nomcom" value="${data.nomcom||''}"></div>
        <div class="field-group"><label>Razón social *</label><input placeholder="Razón social registrada" id="f-razon" value="${data.razon||''}"></div>
      </div>
      <div class="field-row cols-3">
        <div class="field-group"><label>Tomo</label><input placeholder="—" id="f-tomo" value="${data.tomo||''}"></div>

        <div class="field-group"><label>Asiento</label><input placeholder="—" id="f-asiento" value="${data.asiento||''}"></div>
      </div>
      <div class="field-row cols-3">
        <div class="field-group"><label>Ficha</label><input placeholder="—" id="f-ficha" value="${data.ficha||''}"></div>
        <div class="field-group"><label>Rollo</label><input placeholder="—" id="f-rollo" value="${data.rollo||''}"></div>
        <div class="field-group"><label>Imagen</label><input placeholder="—" id="f-imagen" value="${data.imagen||''}"></div>
      </div>
      <div class="field-row cols-2">
        <div class="field-group"><label>Representante legal *</label><input placeholder="Nombre completo" id="f-rl" value="${data.rl||''}"></div>
        <div class="field-group"><label>Cédula / Pasaporte *</label><input placeholder="8-123-4567" id="f-ced" value="${data.ced||''}"></div>
      </div>
      <div class="field-row cols-2">
        <div class="field-group"><label>Nacionalidad</label><input placeholder="Panameña" id="f-nac" value="${data.nac||''}"></div>
        <div class="field-group"><label>Profesión u oficio</label><input placeholder="—" id="f-prof" value="${data.prof||''}"></div>
      </div>
      <div class="field-row"><div class="field-group"><label>Domicilio civil del representante legal</label><input placeholder="Dirección completa" id="f-domicilio" value="${data.domicilio||''}"></div></div>
      <div class="field-row"><div class="field-group"><label>Aviso de Operación N°</label><input placeholder="Número de aviso" id="f-aviso" value="${data.aviso||''}"></div></div>
      `:`
      <p class="subsection-title">Persona natural</p>
      <div class="field-row cols-2">
        <div class="field-group"><label>Nombre *</label><input placeholder="Nombre" id="f-pnom" value="${data.pnom||''}"></div>
        <div class="field-group"><label>Apellidos *</label><input placeholder="Apellidos" id="f-pape" value="${data.pape||''}"></div>
      </div>
      <div class="field-row cols-2">
        <div class="field-group"><label>Cédula / Pasaporte *</label><input placeholder="8-123-4567" id="f-ced" value="${data.ced||''}"></div>
        <div class="field-group"><label>Nacionalidad</label><input placeholder="—" id="f-nac" value="${data.nac||''}"></div>
      </div>
      <div class="field-row"><div class="field-group"><label>Nombre Comercial</label><input placeholder="—" id="f-nomcom" value="${data.nomcom||''}"></div></div>
      `}
      <p class="subsection-title" style="margin-top:8px">Dirección de la empresa</p>
      <div class="field-row cols-2">
        <div class="field-group"><label>Provincia *</label><select id="f-prov"><option value="">Seleccione...</option>${['Panamá','Colón','Panamá Oeste','Chiriquí','Herrera','Los Santos','Veraguas','Coclé','Bocas del Toro','Darién','Guna Yala','Emberá Wounaan','Ngäbe-Buglé'].map(p=>`<option ${data.prov===p?'selected':''}>${p}</option>`).join('')}</select></div>
        <div class="field-group"><label>Distrito</label><input placeholder="—" id="f-dist" value="${data.dist||''}"></div>
      </div>
      <div class="field-row cols-2">
        <div class="field-group"><label>Corregimiento</label><input placeholder="—" id="f-correg" value="${data.correg||''}"></div>
        <div class="field-group"><label>Zona</label><input placeholder="Industrial, Libre, etc." id="f-zona" value="${data.zona||''}"></div>
      </div>
      <div class="field-row cols-2">
        <div class="field-group"><label>Calle / Dirección</label><input placeholder="—" id="f-calle" value="${data.calle||''}"></div>
        <div class="field-group"><label>Teléfono(s)</label><input placeholder="+507 xxx-xxxx" id="f-tel" value="${data.tel||''}"></div>

      <div class="field-row"><div class="field-group"><label>Descripción de actividades que desarrolla la empresa *</label><textarea id="f-activ" placeholder="Describa brevemente las actividades industriales de la empresa...">${data.activ||''}</textarea></div></div>

      <div class="field-row cols-3">
        <div class="field-group"><label>Días por semana</label><input type="number" min="1" max="7" placeholder="5" id="f-dias" value="${data.dias||''}"></div>
        <div class="field-group"><label>Turnos por semana</label><input type="number" min="1" placeholder="1" id="f-turnos" value="${data.turnos||''}"></div>
        <div class="field-group"><label>Horas laborables/semana</label><input type="number" min="1" max="168" placeholder="40" id="f-horas" value="${data.horas||''}"></div>

function renderActividad(){
  const mods = ['Investigación y Desarrollo','Sistemas de Gestión y Aseguramiento de la Calidad','Gestión Ambiental','Inversión o Reinversión de Utilidades','Capacitación y Entrenamiento del Recurso Humano','Incremento en el Empleo Asociado a la Producción'];
  return `

function rowInv(r,i){
  return `<tr id="row-inv-${i}">

    <td><input value="${r.ndoc}" placeholder="N° doc." onchange="updInv(${i},'ndoc',this.value)" style="font-size:11px;border:none;font-family:'DM Sans',sans-serif;width:85px"></td>
    <td><input value="${r.proveedor}" placeholder="Proveedor" onchange="updInv(${i},'proveedor',this.value)" style="font-size:11px;border:none;font-family:'DM Sans',sans-serif;width:135px"></td>

}

function attachEvents(){}

function setTipo(t){
  data.tipo=t;
  document.getElementById('card-juridica').style.cssText = t==='juridica'?'flex:1;border:2px solid var(--teal-mid);border-radius:8px;padding:14px;cursor:pointer;background:var(--teal-light)':'flex:1;border:0.5px solid var(--border);border-radius:8px;padding:14px;cursor:pointer';
  document.getElementById('card-natural').style.cssText = t==='natural'?'flex:1;border:2px solid var(--teal-mid);border-radius:8px;padding:14px;cursor:pointer;background:var(--teal-light)':'flex:1;border:0.5px solid var(--border);border-radius:8px;padding:14px;cursor:pointer';
}

function toggleMod(i){
  if(!data.modalidades)data.modalidades=[];
  const idx=data.modalidades.indexOf(i);
  if(idx>-1)data.modalidades.splice(idx,1);
  else data.modalidades.push(i);
  renderSteps();
  document.getElementById('main-content').innerHTML=renderActividad();
}

function setIncentivo(v){
  data.incentivo=v;
  document.getElementById('main-content').innerHTML=renderActividad();
}

function fileLoaded(id,inp){
  if(inp.files[0]){
    const lbl=document.getElementById('lbl-'+id);
    if(lbl){lbl.innerHTML='<i class="ti ti-check" style="font-size:14px"></i> '+inp.files[0].name.substring(0,20)+'...';lbl.style.background='#EAF3DE';lbl.style.borderColor='#639922';lbl.style.color='#3B6D11';}
  }
}

function addInvRow(){
  inversiones.push({fecha:'',tipo:'FF',ndoc:'',proveedor:'',descripcion:'',monto:'',itbms:''});
  const tbody=document.getElementById('tbody-inv');
  if(tbody){const tr=document.createElement('tr');tr.id='row-inv-'+(inversiones.length-1);tr.innerHTML=rowInv(inversiones[inversiones.length-1],inversiones.length-1).replace(/^<tr[^>]*>/,'').replace(/<\/tr>$/,'');tbody.appendChild(tr);}
}

function delInvRow(i){
  const row=document.getElementById('row-inv-'+i);
  if(row)row.remove();
  calcTotal();
}

function updInv(i,field,val){if(inversiones[i])inversiones[i][field]=val;}

function calcTotal(){
  let total=0;
  document.querySelectorAll('#tbody-inv tr').forEach(tr=>{
    const inputs=tr.querySelectorAll('input[type=number]');
    if(inputs.length>0)total+=parseFloat(inputs[0].value)||0;
  });
  const ti=document.getElementById('total-inv');
  const tc=document.getElementById('total-cfi');
  if(ti)ti.textContent='B/. '+total.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  if(tc)tc.textContent='B/. '+(total*0.4).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}

function calcCFI(){
  let total=0;
  inversiones.forEach(r=>{total+=parseFloat(r.monto)||0;});
  return (total*0.4).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
